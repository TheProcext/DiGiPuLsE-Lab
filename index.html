<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Firebase Connection Diagnostic</title>
<style>
body{font-family:monospace;background:#0d1117;color:#e6edf3;padding:30px;line-height:1.8}
h1{color:#C8102E;font-size:18px;margin-bottom:20px}
.line{padding:6px 12px;border-radius:6px;margin-bottom:6px;font-size:13px}
.pending{background:#1c2330;color:#8b949e}
.ok{background:#0f2419;color:#86efac}
.fail{background:#200a0a;color:#fca5a5}
.info{background:#0c1929;color:#93c5fd}
#log{max-width:800px}
</style>
</head>
<body>
<h1>🔧 Firebase Connection Diagnostic</h1>
<div id="log"></div>

<script>
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDB1Upcp3QmFYOKYR9PTK36iNviNiJtUFc",
  authDomain: "digipulse-c2ae2.firebaseapp.com",
  databaseURL: "https://digipulse-c2ae2-default-rtdb.firebaseio.com",
  projectId: "digipulse-c2ae2",
  storageBucket: "digipulse-c2ae2.firebasestorage.app",
  messagingSenderId: "798551482503",
  appId: "1:798551482503:web:4e66c4e57149264a105822"
};
</script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
function log(msg, type) {
  type = type || 'info';
  var div = document.createElement('div');
  div.className = 'line ' + type;
  div.textContent = msg;
  document.getElementById('log').appendChild(div);
  console.log(msg);
}

log('Step 1: Checking config...', 'pending');
if (FIREBASE_CONFIG.apiKey === 'PASTE_YOUR_apiKey_HERE') {
  log('❌ FAIL: You have not pasted your Firebase config into this file yet!', 'fail');
  log('Open this file in Notepad and paste your real Firebase config at the top.', 'info');
} else {
  log('✅ Config looks filled in. apiKey starts with: ' + FIREBASE_CONFIG.apiKey.substring(0,10) + '...', 'ok');
  log('Database URL: ' + FIREBASE_CONFIG.databaseURL, 'info');

  log('Step 2: Initializing Firebase app...', 'pending');
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    log('✅ Firebase app initialized successfully', 'ok');

    log('Step 3: Attempting anonymous sign-in...', 'pending');
    var authTimeout = setTimeout(function(){
      log('❌ TIMEOUT: signInAnonymously() did not respond within 6 seconds.', 'fail');
      log('→ This means Anonymous Authentication is NOT enabled in your Firebase Console.', 'info');
      log('→ Fix: Firebase Console → Authentication → Sign-in method → Enable "Anonymous"', 'info');
    }, 6000);

    firebase.auth().signInAnonymously().then(function(result) {
      clearTimeout(authTimeout);
      log('✅ Anonymous sign-in succeeded. UID: ' + result.user.uid, 'ok');
      testDatabaseRead();
    }).catch(function(e) {
      clearTimeout(authTimeout);
      log('❌ Anonymous sign-in FAILED: ' + e.code + ' — ' + e.message, 'fail');
      if (e.code === 'auth/configuration-not-found' || e.code === 'auth/operation-not-allowed') {
        log('→ Anonymous Auth is not enabled. Go enable it in Firebase Console.', 'info');
      }
      log('Trying database read anyway without auth...', 'info');
      testDatabaseRead();
    });

  } catch(e) {
    log('❌ FAIL: Firebase initialization threw an error: ' + e.message, 'fail');
  }
}

function testDatabaseRead() {
  log('Step 4: Testing database read at uba-digitalops/projects ...', 'pending');
  var db = firebase.database();
  var readTimeout = setTimeout(function(){
    log('❌ TIMEOUT: Database read did not respond within 8 seconds.', 'fail');
    log('→ Possible causes: wrong databaseURL, rules not published, or network/firewall blocking.', 'info');
  }, 8000);

  db.ref('uba-digitalops/projects').once('value').then(function(snap) {
    clearTimeout(readTimeout);
    var data = snap.val();
    log('✅ Database read SUCCEEDED.', 'ok');
    log('Data found: ' + (data ? Object.keys(data).length + ' projects' : 'empty (null) — this is OK for first run'), 'info');
    testDatabaseWrite();
  }).catch(function(e) {
    clearTimeout(readTimeout);
    log('❌ Database read FAILED: ' + e.code + ' — ' + e.message, 'fail');
    if (e.code === 'PERMISSION_DENIED') {
      log('→ Your Firebase Rules are blocking reads. Check Realtime Database → Rules tab.', 'info');
      log('→ Make sure rules were actually PUBLISHED (not just typed and left unsaved).', 'info');
    }
  });
}

function testDatabaseWrite() {
  log('Step 5: Testing database write (diagnostic test entry)...', 'pending');
  var db = firebase.database();
  var writeTimeout = setTimeout(function(){
    log('❌ TIMEOUT: Database write did not respond within 8 seconds.', 'fail');
  }, 8000);

  db.ref('uba-digitalops/_diagnostic_test').set({test: true, time: Date.now()}).then(function(){
    clearTimeout(writeTimeout);
    log('✅ Database write SUCCEEDED. Your Firebase setup is fully working!', 'ok');
    log('🎉 ALL CHECKS PASSED. Your real app should work now.', 'ok');
    // cleanup
    db.ref('uba-digitalops/_diagnostic_test').remove();
  }).catch(function(e){
    clearTimeout(writeTimeout);
    log('❌ Database write FAILED: ' + e.code + ' — ' + e.message, 'fail');
    if (e.code === 'PERMISSION_DENIED') {
      log('→ Your Firebase Rules are blocking writes on the projects path.', 'info');
    }
  });
}
</script>
</body>
</html>
