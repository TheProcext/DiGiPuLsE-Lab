<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DigitalOps – Project Tracker</title>
<style>
:root{--bg:#0b1120;--surface:#131d30;--card:#1a2540;--border:#263352;--accent:#3b82f6;--accent2:#6366f1;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--text:#e2e8f0;--muted:#8899bb;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.logo{padding:22px 18px 14px}.logo h2{font-size:15px;font-weight:700;color:var(--accent)}.logo p{font-size:11px;color:var(--muted);margin-top:2px}
.nav{padding:8px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;margin-bottom:2px}
.nav-item:hover{background:var(--card);color:var(--text)}.nav-item.active{background:var(--accent);color:#fff}
.role-switch{padding:14px 12px;border-top:1px solid var(--border)}
.role-btn{display:block;width:100%;padding:9px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;text-align:center;transition:all .2s;margin-bottom:6px}
.role-btn.active-role{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.1)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.topbar h1{font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.badge-live{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.content{padding:24px 28px;flex:1}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filter-select,.filter-input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;outline:none;cursor:pointer}
.filter-input{min-width:200px}.filter-select:focus,.filter-input:focus{border-color:var(--accent)}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 10px;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:28px;font-weight:800;margin:6px 0 2px}.stat-card .sub{font-size:11px;color:var(--muted)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
tbody tr:last-child{border-bottom:none}tbody tr:hover{background:rgba(59,130,246,.05)}
td{padding:13px 16px;font-size:13px;vertical-align:middle}
.phase{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.phase-dev{background:rgba(99,102,241,.15);color:#818cf8;border:1px solid rgba(99,102,241,.3)}
.phase-sit{background:rgba(6,182,212,.15);color:#22d3ee;border:1px solid rgba(6,182,212,.3)}
.phase-uat{background:rgba(234,179,8,.15);color:#fde047;border:1px solid rgba(234,179,8,.3)}
.phase-pentest{background:rgba(249,115,22,.15);color:#fb923c;border:1px solid rgba(249,115,22,.3)}
.phase-ccb{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.3)}
.phase-pilot{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.phase-live{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
.prog-wrap{display:flex;align-items:center;gap:8px}
.prog-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:80px}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.prog-label{font-size:12px;font-weight:600;color:var(--muted);width:32px;text-align:right}
.product-tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700}
.close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.detail-item{background:var(--surface);border-radius:8px;padding:12px}
.detail-item .dk{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.detail-item .dv{font-size:13px;font-weight:600}
.phase-stepper{display:flex;align-items:center;margin:16px 0;overflow-x:auto;padding-bottom:4px}
.phase-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:60px}
.phase-step .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--surface);z-index:1}
.phase-step .sname{font-size:9px;color:var(--muted);margin-top:5px;text-align:center}
.phase-step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.phase-step.current .dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.25)}
.phase-connector{flex:1;height:2px;background:var(--border);margin-top:-14px}
.phase-connector.done{background:var(--green)}
.update-log{display:flex;flex-direction:column;gap:10px;max-height:180px;overflow-y:auto}
.log-item{background:var(--surface);border-radius:8px;padding:10px 12px;font-size:12px}
.log-item .log-meta{color:var(--muted);font-size:11px;margin-bottom:3px}
.hd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hd-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .2s}
.hd-card:hover{border-color:var(--accent)}
.hd-big-prog{margin:10px 0 6px}.hd-big-prog .prog-bar{height:10px;border-radius:5px}
.hd-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 1.5s infinite;margin-right:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.sync-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:4px 10px;background:var(--card);border:1px solid var(--border);border-radius:20px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync-dot.syncing{background:var(--yellow);animation:pulse 1s infinite}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;animation:slideUp .3s ease;max-width:340px}
.toast-success{background:#166534;color:#bbf7d0;border:1px solid #22c55e}
.toast-error{background:#7f1d1d;color:#fecaca;border:1px solid #ef4444}
.toast-info{background:#1e3a5f;color:#bfdbfe;border:1px solid #3b82f6}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════
// ALL JAVASCRIPT — regular script tag, fully global scope
// No module imports = no scope issues = filters work 100%
// ═══════════════════════════════════════════════════════

var PHASES = ['Development','SIT','UAT','PENTEST','CCB','Pilot','Live'];
var PCLS = {Development:'phase-dev',SIT:'phase-sit',UAT:'phase-uat',PENTEST:'phase-pentest',CCB:'phase-ccb',Pilot:'phase-pilot',Live:'phase-live'};
var PCOL = {'Mobile App':'#3b82f6','Internet Banking':'#6366f1','Leo':'#a855f7','POS':'#06b6d4','Web Team':'#22c55e','Cards':'#f97316','USSD':'#eab308'};
var DB_PATH = 'digitalops/projects';

function pc(p){ return p>=80?'#22c55e':p>=50?'#3b82f6':p>=25?'#eab308':'#ef4444'; }

var db = null;
var role = 'pm';
var currentPage = 'projects';
var updateId = null;
var editId = null;
var projects = [];
var fProd = 'all';
var fPhase = 'all';
var fSearch = '';
var hdProd = 'all';
var hdPhase = 'all';
var configured = false;

// ── FIREBASE INIT ──
function initApp() {
  configured = FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_apiKey_HERE";

  if (configured) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      startListening();
    } catch(e) {
      document.getElementById('loading-msg').textContent = '❌ Firebase error: ' + e.message;
    }
  } else {
    // Demo mode — works locally without Firebase
    projects = seedData();
    hideLoading();
    renderNav();
    renderContent();
  }
}

// ── REAL-TIME LISTENER ──
// This is the magic: onValue fires instantly on ANY device when data changes
function startListening() {
  db.ref(DB_PATH).on('value', function(snapshot) {
    var data = snapshot.val();
    if (data) {
      projects = Object.values(data).sort(function(a,b){ return a.id - b.id; });
    } else {
      projects = seedData();
      saveToFirebase();
    }
    document.getElementById('sync-label').textContent = 'Live ✓';
    document.getElementById('sync-dot').className = 'sync-dot';
    hideLoading();
    renderContent();
  }, function(err) {
    document.getElementById('loading-msg').textContent = '❌ Firebase failed. Check your databaseURL in the config.';
    console.error(err);
  });
}

function saveToFirebase() {
  if (!db) return;
  setSyncing(true);
  var obj = {};
  projects.forEach(function(p){ obj[p.id] = p; });
  db.ref(DB_PATH).set(obj)
    .then(function(){ setSyncing(false); })
    .catch(function(e){ setSyncing(false); toast('Save error: ' + e.message, 'error'); });
}

function setSyncing(on) {
  var d = document.getElementById('sync-dot');
  var l = document.getElementById('sync-label');
  if (!d) return;
  d.className = 'sync-dot' + (on ? ' syncing' : '');
  l.textContent = on ? 'Saving…' : 'Live ✓';
}

function hideLoading() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

// ── SEED DATA ──
function seedData() {
  return [
    {id:1,name:'Card Tokenization',product:'Cards',ba:'Emeka Okafor',pm:'Ngozi Adeyemi',phase:'UAT',progress:65,start:'2025-02-01',target:'2025-06-30',logs:[{date:'2025-05-20',note:'UAT test cases completed, 3 defects raised'},{date:'2025-04-15',note:'SIT passed with minor issues resolved'}]},
    {id:2,name:'Leo AI Upgrade',product:'Leo',ba:'Chinwe Eze',pm:'Tunde Balogun',phase:'SIT',progress:40,start:'2025-03-01',target:'2025-08-15',logs:[{date:'2025-05-18',note:'Integration testing for NLP module started'}]},
    {id:3,name:'USSD Menu Revamp',product:'USSD',ba:'Amara Nwosu',pm:'Sola Adeleke',phase:'Development',progress:25,start:'2025-04-01',target:'2025-09-30',logs:[{date:'2025-05-10',note:'Backend menu tree finalized'}]},
    {id:4,name:'Mobile Biometric Login',product:'Mobile App',ba:'Chidi Obi',pm:'Ngozi Adeyemi',phase:'PENTEST',progress:78,start:'2025-01-15',target:'2025-06-15',logs:[{date:'2025-05-22',note:'Penetration test by vendor initiated'},{date:'2025-05-01',note:'UAT sign-off received'}]},
    {id:5,name:'Internet Banking Redesign',product:'Internet Banking',ba:'Funke Akinlade',pm:'Yemi Coker',phase:'Pilot',progress:88,start:'2024-11-01',target:'2025-06-01',logs:[{date:'2025-05-23',note:'Pilot with 500 users, feedback positive'}]},
    {id:6,name:'POS Offline Mode',product:'POS',ba:'Ikenna Madu',pm:'Tunde Balogun',phase:'CCB',progress:82,start:'2025-01-10',target:'2025-07-01',logs:[{date:'2025-05-21',note:'CCB approved, awaiting live scheduling'}]},
    {id:7,name:'Web Dashboard Analytics',product:'Web Team',ba:'Seun Oluwole',pm:'Yemi Coker',phase:'Live',progress:100,start:'2024-09-01',target:'2025-03-01',logs:[{date:'2025-03-05',note:'Successfully deployed. Monitoring active'}]},
    {id:8,name:'QR Code Payments',product:'Mobile App',ba:'Blessing Odo',pm:'Sola Adeleke',phase:'Development',progress:15,start:'2025-05-01',target:'2025-11-30',logs:[{date:'2025-05-19',note:'Architecture design document shared'}]},
  ];
}

// ── NAV ──
function renderNav() {
  var items = role === 'pm'
    ? [{id:'projects',icon:'📋',label:'All Projects'},{id:'add',icon:'➕',label:'Add Project'}]
    : [{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'projects',icon:'📋',label:'All Projects'}];
  document.getElementById('nav').innerHTML = items.map(function(i){
    return '<div class="nav-item '+(currentPage===i.id?'active':'')+'" onclick="navigate(\''+i.id+'\')">'+i.icon+' '+i.label+'</div>';
  }).join('');
}

function navigate(p) {
  if (p === 'add') { currentPage = 'projects'; renderNav(); openAddModal(); return; }
  currentPage = p; renderNav(); renderContent();
}

function setRole(r) {
  role = r;
  currentPage = r === 'hd' ? 'dashboard' : 'projects';
  document.getElementById('btn-pm').className = 'role-btn' + (r==='pm' ? ' active-role' : '');
  document.getElementById('btn-hd').className = 'role-btn' + (r==='hd' ? ' active-role' : '');
  document.getElementById('avatar-init').textContent = r==='hd' ? 'HD' : 'PM';
  document.getElementById('page-sub').textContent = r==='hd' ? 'Head of Digital Banking' : 'Product Manager View';
  renderNav(); renderContent();
}

function renderContent() {
  if (currentPage === 'dashboard' && role === 'hd') { renderHD(); return; }
  renderTable();
}

// ── TABLE VIEW ──
function renderTable() {
  document.getElementById('page-title').textContent = 'All Projects';

  var f = projects.filter(function(p) {
    if (fProd !== 'all' && p.product !== fProd) return false;
    if (fPhase !== 'all' && p.phase !== fPhase) return false;
    if (fSearch && p.name.toLowerCase().indexOf(fSearch.toLowerCase()) === -1
                && p.ba.toLowerCase().indexOf(fSearch.toLowerCase()) === -1) return false;
    return true;
  });

  var live = projects.filter(function(p){ return p.phase === 'Live'; }).length;
  var total = projects.length || 1;
  var avg = Math.round(projects.reduce(function(a,p){ return a+p.progress; }, 0) / total);

  var prodOptions = Object.keys(PCOL).map(function(p){
    return '<option value="'+p+'"'+(fProd===p?' selected':'')+'>'+p+'</option>';
  }).join('');
  var phaseOptions = PHASES.map(function(ph){
    return '<option value="'+ph+'"'+(fPhase===ph?' selected':'')+'>'+ph+'</option>';
  }).join('');

  var rows = f.length === 0
    ? '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted)">No projects match the selected filters</td></tr>'
    : f.map(function(p){
        var btns = role === 'pm'
          ? '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openUpdateModal('+p.id+')">Update</button> <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditModal('+p.id+')">Edit</button>'
          : '—';
        return '<tr onclick="openDetail('+p.id+')">'
          + '<td style="color:var(--muted)">'+p.id+'</td>'
          + '<td style="font-weight:600">'+p.name+'</td>'
          + '<td><span class="product-tag" style="background:'+PCOL[p.product]+'22;color:'+PCOL[p.product]+';border:1px solid '+PCOL[p.product]+'44">'+p.product+'</span></td>'
          + '<td>'+p.ba+'</td>'
          + '<td>'+p.pm+'</td>'
          + '<td><span class="phase '+PCLS[p.phase]+'">'+p.phase+'</span></td>'
          + '<td><div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:'+p.progress+'%;background:'+pc(p.progress)+'"></div></div><span class="prog-label">'+p.progress+'%</span></div></td>'
          + '<td style="color:var(--muted);font-size:12px">'+(p.target||'—')+'</td>'
          + '<td>'+btns+'</td>'
          + '</tr>';
      }).join('');

  document.getElementById('content').innerHTML =
    '<div class="stats">'
    + '<div class="stat-card"><div class="label">Total Projects</div><div class="value" style="color:var(--accent)">'+projects.length+'</div><div class="sub">All products</div></div>'
    + '<div class="stat-card"><div class="label">In Progress</div><div class="value" style="color:var(--yellow)">'+(projects.length-live)+'</div><div class="sub">Active phases</div></div>'
    + '<div class="stat-card"><div class="label">Live</div><div class="value" style="color:var(--green)">'+live+'</div><div class="sub">Deployed</div></div>'
    + '<div class="stat-card"><div class="label">Avg Progress</div><div class="value" style="color:'+pc(avg)+'">'+avg+'%</div><div class="sub">Overall</div></div>'
    + '</div>'
    + '<div class="filters">'
    + '<input class="filter-input" placeholder="🔍  Search project or BA…" value="'+fSearch+'" oninput="fSearch=this.value;renderTable()"/>'
    + '<select class="filter-select" onchange="fProd=this.value;renderTable()">'
    + '<option value="all"'+(fProd==='all'?' selected':'')+'>All Products</option>'+prodOptions
    + '</select>'
    + '<select class="filter-select" onchange="fPhase=this.value;renderTable()">'
    + '<option value="all"'+(fPhase==='all'?' selected':'')+'>All Phases</option>'+phaseOptions
    + '</select>'
    + (role==='pm' ? '<button class="btn btn-primary" onclick="openAddModal()">+ New Project</button>' : '')
    + '</div>'
    + '<div class="table-wrap"><table>'
    + '<thead><tr><th>#</th><th>Project Name</th><th>Product</th><th>Business Analyst</th><th>Product Manager</th><th>Phase</th><th>Progress</th><th>Target</th><th>Actions</th></tr></thead>'
    + '<tbody>'+rows+'</tbody>'
    + '</table></div>';
}

// ── HEAD OF DIGITAL DASHBOARD ──
function renderHD() {
  document.getElementById('page-title').textContent = 'Head of Digital – Live Dashboard';

  var byPhase = {};
  PHASES.forEach(function(ph){ byPhase[ph] = projects.filter(function(p){ return p.phase===ph; }).length; });

  var f = projects.filter(function(p) {
    if (hdProd !== 'all' && p.product !== hdProd) return false;
    if (hdPhase !== 'all' && p.phase !== hdPhase) return false;
    return true;
  });

  var prodOptions = Object.keys(PCOL).map(function(p){
    return '<option value="'+p+'"'+(hdProd===p?' selected':'')+'>'+p+'</option>';
  }).join('');
  var phaseOptions = PHASES.map(function(ph){
    return '<option value="'+ph+'"'+(hdPhase===ph?' selected':'')+'>'+ph+'</option>';
  }).join('');

  var phaseCounts = PHASES.map(function(ph){
    return '<div class="stat-card" style="border-color:'+(byPhase[ph]>0?'var(--accent)':'var(--border)')+'"><div class="label">'+ph+'</div><div class="value" style="font-size:22px;color:'+(byPhase[ph]>0?'var(--accent)':'var(--muted)')+'">'+byPhase[ph]+'</div><div class="sub">project'+(byPhase[ph]!==1?'s':'')+'</div></div>';
  }).join('');

  var cards = f.map(function(p) {
    var pi = PHASES.indexOf(p.phase);
    var logs = p.logs || [];
    var ll = logs.length ? logs[logs.length-1] : null;
    var latestNote = ll ? '<div style="margin-top:10px;background:var(--surface);border-radius:7px;padding:9px 11px;font-size:11px;color:var(--muted)"><span style="font-weight:600;color:var(--accent)">Latest:</span> '+ll.note+' <span style="float:right">'+ll.date+'</span></div>' : '';
    var stepper = PHASES.map(function(ph, i){
      var done = i < pi, cur = i === pi;
      var connector = i > 0 ? '<div class="phase-connector '+(done||cur?'done':'')+'"></div>' : '';
      return connector + '<div class="phase-step '+(done?'done':cur?'current':'')+'"><div class="dot">'+(done?'✓':(i+1))+'</div><div class="sname">'+ph+'</div></div>';
    }).join('');
    var borderColor = p.phase==='Live' ? 'rgba(34,197,94,.3)' : p.progress>=75 ? 'rgba(59,130,246,.3)' : 'var(--border)';
    return '<div class="hd-card" onclick="openDetail('+p.id+')" style="border-color:'+borderColor+'">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'
      + '<div><div style="font-size:14px;font-weight:700">'+p.name+'</div>'
      + '<div style="margin-top:3px"><span class="product-tag" style="background:'+PCOL[p.product]+'22;color:'+PCOL[p.product]+';border:1px solid '+PCOL[p.product]+'44">'+p.product+'</span></div></div>'
      + '<span class="phase '+PCLS[p.phase]+'">'+p.phase+'</span></div>'
      + '<div class="hd-big-prog"><div class="prog-bar"><div class="prog-fill" style="width:'+p.progress+'%;background:'+pc(p.progress)+'"></div></div></div>'
      + '<div class="hd-meta"><span style="color:'+pc(p.progress)+';font-weight:700">'+p.progress+'% complete</span><span>Target: '+(p.target||'TBD')+'</span></div>'
      + '<div style="margin-top:10px;font-size:11px;color:var(--muted)">BA: <b style="color:var(--text)">'+p.ba+'</b> &nbsp;|&nbsp; PM: <b style="color:var(--text)">'+p.pm+'</b></div>'
      + latestNote
      + '<div class="phase-stepper" style="margin-top:12px">'+stepper+'</div>'
      + '</div>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<div class="stats" style="margin-bottom:20px">'+phaseCounts+'</div>'
    + '<div class="filters" style="margin-bottom:20px">'
    + '<select class="filter-select" onchange="hdProd=this.value;renderHD()"><option value="all"'+(hdProd==='all'?' selected':'')+'>All Products</option>'+prodOptions+'</select>'
    + '<select class="filter-select" onchange="hdPhase=this.value;renderHD()"><option value="all"'+(hdPhase==='all'?' selected':'')+'>All Phases</option>'+phaseOptions+'</select>'
    + '</div>'
    + '<div class="hd-grid">'+cards+'</div>';
}

// ── DETAIL MODAL ──
function openDetail(id) {
  var p = projects.find(function(x){ return x.id===id; });
  if (!p) return;
  var pi = PHASES.indexOf(p.phase);
  var logs = p.logs || [];
  var stepper = PHASES.map(function(ph,i){
    var done=i<pi, cur=i===pi;
    return (i>0?'<div class="phase-connector '+(done||cur?'done':'')+'"></div>':'')
      +'<div class="phase-step '+(done?'done':cur?'current':'')+'"><div class="dot">'+(done?'✓':(i+1))+'</div><div class="sname">'+ph+'</div></div>';
  }).join('');
  var logItems = logs.length === 0
    ? '<div style="color:var(--muted);font-size:12px;padding:8px">No updates yet.</div>'
    : logs.slice().reverse().map(function(l){ return '<div class="log-item"><div class="log-meta">'+l.date+'</div>'+l.note+'</div>'; }).join('');
  document.getElementById('dm-title').textContent = p.name;
  document.getElementById('dm-body').innerHTML =
    '<div class="detail-grid">'
    +'<div class="detail-item"><div class="dk">Product</div><div class="dv"><span class="product-tag" style="background:'+PCOL[p.product]+'22;color:'+PCOL[p.product]+'">'+p.product+'</span></div></div>'
    +'<div class="detail-item"><div class="dk">Phase</div><div class="dv"><span class="phase '+PCLS[p.phase]+'">'+p.phase+'</span></div></div>'
    +'<div class="detail-item"><div class="dk">Business Analyst</div><div class="dv">'+p.ba+'</div></div>'
    +'<div class="detail-item"><div class="dk">Product Manager</div><div class="dv">'+p.pm+'</div></div>'
    +'<div class="detail-item"><div class="dk">Start Date</div><div class="dv">'+(p.start||'—')+'</div></div>'
    +'<div class="detail-item"><div class="dk">Target Go-Live</div><div class="dv">'+(p.target||'—')+'</div></div>'
    +'</div>'
    +'<div style="margin-bottom:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Overall Progress</div>'
    +'<div class="prog-wrap" style="margin-bottom:16px"><div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:'+p.progress+'%;background:'+pc(p.progress)+'"></div></div><span style="font-size:15px;font-weight:700;color:'+pc(p.progress)+'">'+p.progress+'%</span></div>'
    +'<div style="margin-bottom:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Phase Journey</div>'
    +'<div class="phase-stepper">'+stepper+'</div>'
    +'<div style="margin:16px 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Update Log ('+logs.length+')</div>'
    +'<div class="update-log">'+logItems+'</div>';
  document.getElementById('detail-modal').style.display = 'flex';
}
function closeDetailModal(){ document.getElementById('detail-modal').style.display='none'; }

// ── ADD / EDIT MODAL ──
function openAddModal() {
  editId = null;
  document.getElementById('modal-title').textContent = 'Add New Project';
  ['f-name','f-ba','f-pm-name','f-update'].forEach(function(i){ document.getElementById(i).value=''; });
  document.getElementById('f-progress').value = '0';
  document.getElementById('f-start').value = '';
  document.getElementById('f-target').value = '';
  document.getElementById('modal').style.display = 'flex';
}
function openEditModal(id) {
  var p = projects.find(function(x){ return x.id===id; });
  if (!p) return;
  editId = id;
  document.getElementById('modal-title').textContent = 'Edit Project';
  document.getElementById('f-name').value = p.name;
  document.getElementById('f-ba').value = p.ba;
  document.getElementById('f-pm-name').value = p.pm;
  document.getElementById('f-product').value = p.product;
  document.getElementById('f-phase').value = p.phase;
  document.getElementById('f-progress').value = p.progress;
  document.getElementById('f-start').value = p.start||'';
  document.getElementById('f-target').value = p.target||'';
  document.getElementById('f-update').value = '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }

function saveProject() {
  var name = document.getElementById('f-name').value.trim();
  var ba   = document.getElementById('f-ba').value.trim();
  var pm   = document.getElementById('f-pm-name').value.trim();
  if (!name||!ba||!pm){ toast('Please fill in Project Name, BA, and PM','error'); return; }
  var note = document.getElementById('f-update').value.trim();
  if (editId) {
    var p = projects.find(function(x){ return x.id===editId; });
    p.name=name; p.ba=ba; p.pm=pm;
    p.product  = document.getElementById('f-product').value;
    p.phase    = document.getElementById('f-phase').value;
    p.progress = parseInt(document.getElementById('f-progress').value)||0;
    p.start    = document.getElementById('f-start').value;
    p.target   = document.getElementById('f-target').value;
    if (note){ if(!p.logs)p.logs=[]; p.logs.push({date:today(),note:note}); }
  } else {
    var maxId = projects.reduce(function(m,p){ return Math.max(m,p.id); }, 0);
    projects.push({
      id: maxId+1, name:name, ba:ba, pm:pm,
      product:  document.getElementById('f-product').value,
      phase:    document.getElementById('f-phase').value,
      progress: parseInt(document.getElementById('f-progress').value)||0,
      start:    document.getElementById('f-start').value,
      target:   document.getElementById('f-target').value,
      logs:     note ? [{date:today(),note:note}] : []
    });
  }
  closeModal();
  if (configured) { saveToFirebase(); }
  toast(editId ? '✅ Project updated!' : '✅ Project added!', 'success');
  renderContent();
}

// ── UPDATE MODAL ──
function openUpdateModal(id) {
  updateId = id;
  var p = projects.find(function(x){ return x.id===id; });
  document.getElementById('um-title').textContent = 'Update: ' + p.name;
  document.getElementById('u-phase').value = p.phase;
  document.getElementById('u-progress').value = p.progress;
  document.getElementById('u-note').value = '';
  document.getElementById('update-modal').style.display = 'flex';
}
function closeUpdateModal(){ document.getElementById('update-modal').style.display='none'; }

function submitUpdate() {
  var note = document.getElementById('u-note').value.trim();
  if (!note){ toast('Please enter an update note','error'); return; }
  var p = projects.find(function(x){ return x.id===updateId; });
  p.phase    = document.getElementById('u-phase').value;
  p.progress = parseInt(document.getElementById('u-progress').value)||p.progress;
  if (!p.logs) p.logs = [];
  p.logs.push({date:today(), note:note});
  closeUpdateModal();
  if (configured) { saveToFirebase(); }
  toast('✅ Update posted — visible to all users instantly!', 'success');
  renderContent();
}

function today(){ return new Date().toISOString().slice(0,10); }

function toast(msg, type) {
  type = type || 'success';
  var t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3500);
}

// ── START ──
window.onload = function(){ initApp(); };
</script>
</body>
