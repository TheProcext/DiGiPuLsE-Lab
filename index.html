<!-- Firebase SDKs -->
<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── CHECK CONFIG ──
const configured = FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_apiKey_HERE";

const PHASES=['Development','SIT','UAT','PENTEST','CCB','Pilot','Live'];
const PCLS={Development:'phase-dev',SIT:'phase-sit',UAT:'phase-uat',PENTEST:'phase-pentest',CCB:'phase-ccb',Pilot:'phase-pilot',Live:'phase-live'};
const PCOL={'Mobile App':'#3b82f6','Internet Banking':'#6366f1','Leo':'#a855f7','POS':'#06b6d4','Web Team':'#22c55e','Cards':'#f97316','USSD':'#eab308'};
const DB_PATH = 'digitalops/projects';

const pc=p=>p>=80?'#22c55e':p>=50?'#3b82f6':p>=25?'#eab308':'#ef4444';

let db=null, role='pm', currentPage='projects', updateId=null, editId=null;
let projects=[], fProd='all', fPhase='all', fSearch='', hdProd='all', hdPhase='all';

// ── INIT FIREBASE ──
function initFirebase(){
  try{
    const app = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(app);
    return true;
  }catch(e){ return false; }
}

// ── REAL-TIME LISTENER ──
function listenToProjects(){
  const dbRef = ref(db, DB_PATH);
  onValue(dbRef, snapshot => {
    const data = snapshot.val();
    if(data){
      projects = Object.values(data).sort((a,b)=>a.id-b.id);
    } else {
      // First time — seed default data
      projects = seedData();
      pushToFirebase();
    }
    document.getElementById('sync-label').textContent = 'Live ✓';
    document.getElementById('sync-dot').className = 'sync-dot';
    hideLoading();
    renderContent();
  }, err => {
    console.error(err);
    document.getElementById('sync-label').textContent = 'Error';
    document.getElementById('loading-msg').textContent = '❌ Firebase connection failed. Check your config.';
  });
}

async function pushToFirebase(){
  if(!db) return false;
  setSyncing(true);
  try{
    const obj={};
    projects.forEach(p=>{ obj[p.id]=p; });
    await set(ref(db, DB_PATH), obj);
    setSyncing(false);
    return true;
  }catch(e){
    setSyncing(false);
    toast('Firebase write failed: '+e.message,'error');
    return false;
  }
}

function setSyncing(on){
  const d=document.getElementById('sync-dot');
  const l=document.getElementById('sync-label');
  if(!d)return;
  d.className='sync-dot'+(on?' syncing':'');
  l.textContent=on?'Saving…':'Live ✓';
}

function hideLoading(){
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app').style.display='flex';
}

// ── SEED DATA ──
function seedData(){
  return [
    {id:1,name:'Card Tokenization',product:'Cards',ba:'Emeka Okafor',pm:'Ngozi Adeyemi',phase:'UAT',progress:65,start:'2025-02-01',target:'2025-06-30',logs:[{date:'2025-05-20',note:'UAT test cases completed, 3 defects raised'},{date:'2025-04-15',note:'SIT passed with minor issues resolved'}]},
    {id:2,name:'Leo AI Upgrade',product:'Leo',ba:'Chinwe Eze',pm:'Tunde Balogun',phase:'SIT',progress:40,start:'2025-03-01',target:'2025-08-15',logs:[{date:'2025-05-18',note:'Integration testing for NLP module started'}]},
    {id:3,name:'USSD Menu Revamp',product:'USSD',ba:'Amara Nwosu',pm:'Sola Adeleke',phase:'Development',progress:25,start:'2025-04-01',target:'2025-09-30',logs:[{date:'2025-05-10',note:'Backend menu tree finalized'}]},
    {id:4,name:'Mobile Biometric Login',product:'Mobile App',ba:'Chidi Obi',pm:'Ngozi Adeyemi',phase:'PENTEST',progress:78,start:'2025-01-15',target:'2025-06-15',logs:[{date:'2025-05-22',note:'Penetration test by vendor initiated'},{date:'2025-05-01',note:'UAT sign-off received'}]},
    {id:5,name:'Internet Banking Redesign',product:'Internet Banking',ba:'Funke Akinlade',pm:'Yemi Coker',phase:'Pilot',progress:88,start:'2024-11-01',target:'2025-06-01',logs:[{date:'2025-05-23',note:'Pilot with 500 users, feedback positive'}]},
    {id:6,name:'POS Offline Mode',product:'POS',ba:'Ikenna Madu',pm:'Tunde Balogun',phase:'CCB',progress:82,start:'2025-01-10',target:'2025-07-01',logs:[{date:'2025-05-21',note:'CCB approved, awaiting live scheduling'}]},
    {id:7,name:'Web Dashboard Analytics',product:'Web Team',ba:'Seun Oluwole',pm:'Yemi Coker',phase:'Live',progress:100,start:'2024-09-01',target:'2025-03-01',logs:[{date:'2025-03-05',note:'Successfully deployed. Monitoring active'}]},
    {id:8,name:'QR Code Payments',product:'Mobile App',ba:'Blessing Odo',pm:'Sola Adeleke',phase:'Development',progress:15,start:'2025-05-01',target:'2025-11-30',logs:[{date:'2025-05-19',note:'Architecture design document shared'}]},
  ];
}

// ── NAV ──
function renderNav(){
  const items=role==='pm'
    ?[{id:'projects',icon:'📋',label:'All Projects'},{id:'add',icon:'➕',label:'Add Project'}]
    :[{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'projects',icon:'📋',label:'All Projects'}];
  document.getElementById('nav').innerHTML=items.map(i=>
    `<div class="nav-item ${currentPage===i.id?'active':''}" onclick="window._nav('${i.id}')">${i.icon} ${i.label}</div>`
  ).join('');
}

window._nav=function(p){
  if(p==='add'){currentPage='projects';renderNav();openAddModal();return;}
  currentPage=p;renderNav();renderContent();
};

window.setRole=function(r){
  role=r;currentPage=r==='hd'?'dashboard':'projects';
  document.getElementById('btn-pm').className='role-btn'+(r==='pm'?' active-role':'');
  document.getElementById('btn-hd').className='role-btn'+(r==='hd'?' active-role':'');
  document.getElementById('avatar-init').textContent=r==='hd'?'HD':'PM';
  document.getElementById('page-sub').textContent=r==='hd'?'Head of Digital Banking':'Product Manager View';
  renderNav();renderContent();
};

function renderContent(){
  if(currentPage==='dashboard'&&role==='hd'){renderHD();return;}
  renderTable();
}

// ── TABLE ──
function renderTable(){
  document.getElementById('page-title').textContent='All Projects';
  const f=projects.filter(p=>{
    if(fProd!=='all'&&p.product!==fProd)return false;
    if(fPhase!=='all'&&p.phase!==fPhase)return false;
    if(fSearch&&!p.name.toLowerCase().includes(fSearch.toLowerCase())&&!p.ba.toLowerCase().includes(fSearch.toLowerCase()))return false;
    return true;
  });
  const live=projects.filter(p=>p.phase==='Live').length;
  const avg=Math.round(projects.reduce((a,p)=>a+p.progress,0)/(projects.length||1));
  document.getElementById('content').innerHTML=`
    ${!configured?`<div class="setup-banner">⚠️ <b>Firebase not configured yet.</b> This is running in demo mode (data won't sync across devices). Follow the setup guide below the app to connect Firebase for real-time sync.</div>`:''}
    <div class="stats">
      <div class="stat-card"><div class="label">Total Projects</div><div class="value" style="color:var(--accent)">${projects.length}</div><div class="sub">All products</div></div>
      <div class="stat-card"><div class="label">In Progress</div><div class="value" style="color:var(--yellow)">${projects.length-live}</div><div class="sub">Active phases</div></div>
      <div class="stat-card"><div class="label">Live</div><div class="value" style="color:var(--green)">${live}</div><div class="sub">Deployed</div></div>
      <div class="stat-card"><div class="label">Avg Progress</div><div class="value" style="color:${pc(avg)}">${avg}%</div><div class="sub">Overall</div></div>
    </div>
    <div class="filters">
      <input class="filter-input" placeholder="🔍  Search project or BA…" value="${fSearch}" oninput="fSearch=this.value;renderTable()"/>
      <select class="filter-select" onchange="fProd=this.value;renderTable()">
        <option value="all">All Products</option>
        ${Object.keys(PCOL).map(p=>`<option value="${p}" ${fProd===p?'selected':''}>${p}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="fPhase=this.value;renderTable()">
        <option value="all">All Phases</option>
        ${PHASES.map(ph=>`<option value="${ph}" ${fPhase===ph?'selected':''}>${ph}</option>`).join('')}
      </select>
      ${role==='pm'?`<button class="btn btn-primary" onclick="openAddModal()">+ New Project</button>`:''}
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Project Name</th><th>Product</th><th>Business Analyst</th><th>Product Manager</th><th>Phase</th><th>Progress</th><th>Target</th><th>Actions</th></tr></thead>
      <tbody>${f.length===0
        ?`<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--muted)">No projects match filters</td></tr>`
        :f.map(p=>`<tr onclick="openDetail(${p.id})">
          <td style="color:var(--muted)">${p.id}</td>
          <td style="font-weight:600">${p.name}</td>
          <td><span class="product-tag" style="background:${PCOL[p.product]}22;color:${PCOL[p.product]};border:1px solid ${PCOL[p.product]}44">${p.product}</span></td>
          <td>${p.ba}</td><td>${p.pm}</td>
          <td><span class="phase ${PCLS[p.phase]}">${p.phase}</span></td>
          <td><div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:${p.progress}%;background:${pc(p.progress)}"></div></div><span class="prog-label">${p.progress}%</span></div></td>
          <td style="color:var(--muted);font-size:12px">${p.target||'—'}</td>
          <td onclick="event.stopPropagation()">${role==='pm'
            ?`<button class="btn btn-ghost btn-sm" onclick="openUpdateModal(${p.id})">Update</button> <button class="btn btn-ghost btn-sm" onclick="openEditModal(${p.id})">Edit</button>`
            :'—'}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
}

// ── HEAD DASHBOARD ──
function renderHD(){
  document.getElementById('page-title').textContent='Head of Digital – Live Dashboard';
  const byPhase={};PHASES.forEach(ph=>byPhase[ph]=projects.filter(p=>p.phase===ph).length);
  const f=projects.filter(p=>{
    if(hdProd!=='all'&&p.product!==hdProd)return false;
    if(hdPhase!=='all'&&p.phase!==hdPhase)return false;
    return true;
  });
  document.getElementById('content').innerHTML=`
    <div class="stats" style="margin-bottom:20px">
      ${PHASES.map(ph=>`<div class="stat-card" style="border-color:${byPhase[ph]>0?'var(--accent)':'var(--border)'}">
        <div class="label">${ph}</div>
        <div class="value" style="font-size:22px;color:${byPhase[ph]>0?'var(--accent)':'var(--muted)'}">${byPhase[ph]}</div>
        <div class="sub">project${byPhase[ph]!==1?'s':''}</div>
      </div>`).join('')}
    </div>
    <div class="filters" style="margin-bottom:20px">
      <select class="filter-select" onchange="hdProd=this.value;renderHD()">
        <option value="all">All Products</option>
        ${Object.keys(PCOL).map(p=>`<option value="${p}" ${hdProd===p?'selected':''}>${p}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="hdPhase=this.value;renderHD()">
        <option value="all">All Phases</option>
        ${PHASES.map(ph=>`<option value="${ph}" ${hdPhase===ph?'selected':''}>${ph}</option>`).join('')}
      </select>
    </div>
    <div class="hd-grid">
      ${f.map(p=>{
        const pi=PHASES.indexOf(p.phase),ll=p.logs&&p.logs.length?p.logs[p.logs.length-1]:null;
        return `<div class="hd-card" onclick="openDetail(${p.id})" style="border-color:${p.phase==='Live'?'rgba(34,197,94,.3)':p.progress>=75?'rgba(59,130,246,.3)':'var(--border)'}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
            <div>
              <div style="font-size:14px;font-weight:700">${p.name}</div>
              <div style="margin-top:3px"><span class="product-tag" style="background:${PCOL[p.product]}22;color:${PCOL[p.product]};border:1px solid ${PCOL[p.product]}44">${p.product}</span></div>
            </div>
            <span class="phase ${PCLS[p.phase]}">${p.phase}</span>
          </div>
          <div class="hd-big-prog"><div class="prog-bar"><div class="prog-fill" style="width:${p.progress}%;background:${pc(p.progress)}"></div></div></div>
          <div class="hd-meta">
            <span style="color:${pc(p.progress)};font-weight:700">${p.progress}% complete</span>
            <span>Target: ${p.target||'TBD'}</span>
          </div>
          <div style="margin-top:10px;font-size:11px;color:var(--muted)">BA: <b style="color:var(--text)">${p.ba}</b> &nbsp;|&nbsp; PM: <b style="color:var(--text)">${p.pm}</b></div>
          ${ll?`<div style="margin-top:10px;background:var(--surface);border-radius:7px;padding:9px 11px;font-size:11px;color:var(--muted)">
            <span style="font-weight:600;color:var(--accent)">Latest:</span> ${ll.note} <span style="float:right">${ll.date}</span>
          </div>`:''}
          <div class="phase-stepper" style="margin-top:12px">
            ${PHASES.map((ph,i)=>{const done=i<pi,cur=i===pi;return `${i>0?`<div class="phase-connector ${done||cur?'done':''}"></div>`:''}
            <div class="phase-step ${done?'done':cur?'current':''}"><div class="dot">${done?'✓':i+1}</div><div class="sname">${ph}</div></div>`;}).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// ── DETAIL ──
window.openDetail=function(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  const pi=PHASES.indexOf(p.phase);
  document.getElementById('dm-title').textContent=p.name;
  const logs=p.logs||[];
  document.getElementById('dm-body').innerHTML=`
    <div class="detail-grid">
      <div class="detail-item"><div class="dk">Product</div><div class="dv"><span class="product-tag" style="background:${PCOL[p.product]}22;color:${PCOL[p.product]}">${p.product}</span></div></div>
      <div class="detail-item"><div class="dk">Phase</div><div class="dv"><span class="phase ${PCLS[p.phase]}">${p.phase}</span></div></div>
      <div class="detail-item"><div class="dk">Business Analyst</div><div class="dv">${p.ba}</div></div>
      <div class="detail-item"><div class="dk">Product Manager</div><div class="dv">${p.pm}</div></div>
      <div class="detail-item"><div class="dk">Start Date</div><div class="dv">${p.start||'—'}</div></div>
      <div class="detail-item"><div class="dk">Target Go-Live</div><div class="dv">${p.target||'—'}</div></div>
    </div>
    <div style="margin-bottom:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Overall Progress</div>
    <div class="prog-wrap" style="margin-bottom:16px">
      <div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:${p.progress}%;background:${pc(p.progress)}"></div></div>
      <span style="font-size:15px;font-weight:700;color:${pc(p.progress)}">${p.progress}%</span>
    </div>
    <div style="margin-bottom:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Phase Journey</div>
    <div class="phase-stepper">
      ${PHASES.map((ph,i)=>{const done=i<pi,cur=i===pi;return `${i>0?`<div class="phase-connector ${done||cur?'done':''}"></div>`:''}
      <div class="phase-step ${done?'done':cur?'current':''}"><div class="dot">${done?'✓':i+1}</div><div class="sname">${ph}</div></div>`;}).join('')}
    </div>
    <div style="margin:16px 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Update Log (${logs.length})</div>
    <div class="update-log">
      ${logs.length===0?`<div style="color:var(--muted);font-size:12px;padding:8px">No updates yet.</div>`
        :[...logs].reverse().map(l=>`<div class="log-item"><div class="log-meta">${l.date}</div>${l.note}</div>`).join('')}
    </div>`;
  document.getElementById('detail-modal').style.display='flex';
};
window.closeDetailModal=function(){document.getElementById('detail-modal').style.display='none';};

// ── ADD / EDIT ──
window.openAddModal=function(){
  editId=null;
  document.getElementById('modal-title').textContent='Add New Project';
  ['f-name','f-ba','f-pm-name','f-update'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('f-progress').value='0';
  document.getElementById('f-start').value='';
  document.getElementById('f-target').value='';
  document.getElementById('modal').style.display='flex';
};
window.openEditModal=function(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  editId=id;
  document.getElementById('modal-title').textContent='Edit Project';
  document.getElementById('f-name').value=p.name;
  document.getElementById('f-ba').value=p.ba;
  document.getElementById('f-pm-name').value=p.pm;
  document.getElementById('f-product').value=p.product;
  document.getElementById('f-phase').value=p.phase;
  document.getElementById('f-progress').value=p.progress;
  document.getElementById('f-start').value=p.start||'';
  document.getElementById('f-target').value=p.target||'';
  document.getElementById('f-update').value='';
  document.getElementById('modal').style.display='flex';
};
window.closeModal=function(){document.getElementById('modal').style.display='none';};

window.saveProject=async function(){
  const name=document.getElementById('f-name').value.trim();
  const ba=document.getElementById('f-ba').value.trim();
  const pm=document.getElementById('f-pm-name').value.trim();
  if(!name||!ba||!pm){toast('Please fill in Project Name, BA, and PM','error');return;}
  const note=document.getElementById('f-update').value.trim();
  if(editId){
    const p=projects.find(x=>x.id===editId);
    Object.assign(p,{name,ba,pm,product:document.getElementById('f-product').value,phase:document.getElementById('f-phase').value,progress:parseInt(document.getElementById('f-progress').value)||0,start:document.getElementById('f-start').value,target:document.getElementById('f-target').value});
    if(note){if(!p.logs)p.logs=[];p.logs.push({date:td(),note});}
  }else{
    const maxId=projects.reduce((m,p)=>Math.max(m,p.id),0);
    projects.push({id:maxId+1,name,ba,pm,product:document.getElementById('f-product').value,phase:document.getElementById('f-phase').value,progress:parseInt(document.getElementById('f-progress').value)||0,start:document.getElementById('f-start').value,target:document.getElementById('f-target').value,logs:note?[{date:td(),note}]:[]});
  }
  const ok=await pushToFirebase();
  if(ok){closeModal();toast(editId?'✅ Project updated — synced live!':'✅ Project added — visible to all!','success');}
};

// ── UPDATE ──
window.openUpdateModal=function(id){
  updateId=id;
  const p=projects.find(x=>x.id===id);
  document.getElementById('um-title').textContent='Update: '+p.name;
  document.getElementById('u-phase').value=p.phase;
  document.getElementById('u-progress').value=p.progress;
  document.getElementById('u-note').value='';
  document.getElementById('update-modal').style.display='flex';
};
window.closeUpdateModal=function(){document.getElementById('update-modal').style.display='none';};
window.submitUpdate=async function(){
  const note=document.getElementById('u-note').value.trim();
  if(!note){toast('Please enter an update note','error');return;}
  const p=projects.find(x=>x.id===updateId);
  p.phase=document.getElementById('u-phase').value;
  p.progress=parseInt(document.getElementById('u-progress').value)||p.progress;
  if(!p.logs)p.logs=[];
  p.logs.push({date:td(),note});
  const ok=await pushToFirebase();
  if(ok){closeUpdateModal();toast('✅ Update saved — Head of Digital sees this instantly!','success');}
};

function td(){return new Date().toISOString().slice(0,10);}
function toast(msg,type='success'){
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3500);
}

// ── EXPOSE ALL FUNCTIONS CALLED FROM INLINE HTML (module scope fix) ──
// Inside type="module", functions are NOT global by default.
// We must explicitly attach everything called via onclick/onchange to window.
window.renderTable  = ()=> renderTable();
window.renderHD     = ()=> renderHD();
window.openAddModal = ()=> openAddModal();
window.openEditModal= (id)=> openEditModal(id);
window.openUpdateModal=(id)=> openUpdateModal(id);
window.closeModal   = ()=> closeModal();
window.closeUpdateModal=()=> closeUpdateModal();
window.openDetail   = (id)=> openDetail(id);
window.closeDetailModal=()=> closeDetailModal();
window.saveProject  = ()=> saveProject();
window.submitUpdate = ()=> submitUpdate();

// ── BOOT ──
if(configured){
  if(initFirebase()){
    renderNav();
    listenToProjects(); // real-time listener — auto-updates all open browsers instantly
  } else {
    document.getElementById('loading-msg').textContent='❌ Firebase init failed. Check your config values.';
  }
} else {
  // Demo mode — no Firebase config yet
  projects = seedData();
  hideLoading();
  renderNav();
  renderContent();
}

</script>
</body>
</html>
